<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>orgmem — Devpost thumbnail</title>
<style>
  :root {
    --bg: #FBFAF7;
    --ink: #12100E;
    --muted: #6E675F;
    --faint: #A49C93;
    --rule: #E4DFD6;
    --rule-lit: #D5CEC2;
    --panel: #FFFEFB;
    --accent: #E5432B;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1800px;
    height: 1200px;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-synthesis-weight: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    box-sizing: border-box;
    width: 1800px;
    height: 1200px;
    padding: 96px 110px 92px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- top row ---------- */

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: 30px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0;
  }

  /* ---------- main ---------- */

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 54% 46%;
    align-items: center;
    gap: 40px;
    min-height: 0;
  }

  h1 {
    font-size: 86px;
    line-height: 1.0;
    letter-spacing: -0.035em;
    font-weight: 560;
    margin: 0;
    max-width: 15ch;
  }

  .sub {
    margin: 40px 0 0;
    font-size: 33px;
    line-height: 1.42;
    letter-spacing: -0.005em;
    color: var(--muted);
    max-width: 24ch;
  }

  .copy { margin-top: 26px; }

  .motif {
    justify-self: end;
    align-self: center;
  }

  /* ---------- bottom ---------- */

  .stats {
    border-top: 1px solid var(--rule);
    padding-top: 44px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 48px;
  }

  .stat { margin: 0; }

  .stat-n {
    font-size: 62px;
    line-height: 1;
    letter-spacing: -0.04em;
    font-weight: 560;
    font-variant-numeric: tabular-nums;
  }

  .stat-n-accent { color: var(--accent); }

  .stat-l {
    font-family: var(--mono);
    font-size: 21px;
    line-height: 1.5;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 20px 0 0;
  }

  .stat-l span { color: var(--faint); letter-spacing: 0.11em; }
</style>
</head>
<body>
<div class="frame">

  <div class="top">
    <p class="wordmark">orgmem</p>
    <p class="eyebrow">JacHacks SF &middot; 2026</p>
  </div>

  <div class="main">
    <div class="copy">
      <h1>Organizational memory for agents.</h1>
      <p class="sub">Proves what your company never wrote down.</p>
    </div>

    <svg class="motif" width="772" height="684" viewBox="0 0 700 620" fill="none" aria-hidden="true">
      <!-- edges: thin, quiet, irregular -->
      <g stroke="#D5CEC2" stroke-width="1.6" stroke-linecap="round">
        <line x1="118" y1="188" x2="243" y2="118"/>
        <line x1="243" y1="118" x2="381" y2="163"/>
        <line x1="118" y1="188" x2="205" y2="296"/>
        <line x1="205" y1="296" x2="381" y2="163"/>
        <line x1="381" y1="163" x2="524" y2="112"/>
        <line x1="524" y1="112" x2="612" y2="206"/>
        <line x1="381" y1="163" x2="561" y2="271"/>
        <line x1="612" y1="206" x2="561" y2="271"/>
        <line x1="205" y1="296" x2="349" y2="343"/>
        <line x1="349" y1="343" x2="561" y2="271"/>
        <line x1="205" y1="296" x2="146" y2="422"/>
        <line x1="146" y1="422" x2="288" y2="466"/>
        <line x1="288" y1="466" x2="349" y2="343"/>
        <line x1="288" y1="466" x2="452" y2="519"/>
        <line x1="452" y1="519" x2="597" y2="431"/>
        <line x1="597" y1="431" x2="561" y2="271"/>
        <line x1="349" y1="343" x2="597" y2="431"/>
        <line x1="146" y1="422" x2="233" y2="561"/>
        <line x1="233" y1="561" x2="452" y2="519"/>
        <line x1="243" y1="118" x2="349" y2="343"/>
        <line x1="524" y1="112" x2="381" y2="163"/>
      </g>

      <!-- edges into the accent node: the paths that converge on the gap -->
      <g stroke="#D5CEC2" stroke-width="1.6" stroke-linecap="round">
        <line x1="349" y1="343" x2="437" y2="243"/>
        <line x1="561" y1="271" x2="437" y2="243"/>
        <line x1="381" y1="163" x2="437" y2="243"/>
      </g>

      <!-- dashed edges trailing off into empty space: what was never written down -->
      <g stroke="#D5CEC2" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 11" opacity="0.85">
        <line x1="437" y1="243" x2="656" y2="330"/>
        <line x1="437" y1="243" x2="332" y2="86"/>
        <line x1="288" y1="466" x2="86" y2="536"/>
      </g>

      <!-- nodes -->
      <g fill="#12100E">
        <circle cx="118" cy="188" r="6.5"/>
        <circle cx="243" cy="118" r="9"/>
        <circle cx="381" cy="163" r="12"/>
        <circle cx="524" cy="112" r="7"/>
        <circle cx="612" cy="206" r="5.5"/>
        <circle cx="561" cy="271" r="11"/>
        <circle cx="205" cy="296" r="10"/>
        <circle cx="349" cy="343" r="13"/>
        <circle cx="146" cy="422" r="7.5"/>
        <circle cx="288" cy="466" r="10"/>
        <circle cx="452" cy="519" r="6.5"/>
        <circle cx="597" cy="431" r="8.5"/>
        <circle cx="233" cy="561" r="6"/>
      </g>

      <!-- the absent node -->
      <circle cx="437" cy="243" r="33" fill="#FBFAF7"/>
      <circle cx="437" cy="243" r="33" fill="none" stroke="#E5432B" stroke-width="1.5" opacity="0.32"/>
      <circle cx="437" cy="243" r="21" fill="none" stroke="#E5432B" stroke-width="1.8" opacity="0.62"/>
      <circle cx="437" cy="243" r="11.5" fill="#E5432B"/>
    </svg>
  </div>

  <div class="stats">
    <p class="stat">
      <span class="stat-n">94.7%</span>
      <span class="stat-l" style="display:block">Accuracy<br><span>78 ground-truth questions</span></span>
    </p>
    <p class="stat">
      <span class="stat-n">96.3%</span>
      <span class="stat-l" style="display:block">Silence class<br><span>vs 55.6% baseline</span></span>
    </p>
    <p class="stat">
      <span class="stat-n">100%</span>
      <span class="stat-l" style="display:block">Jac</span>
    </p>
  </div>

</div>
</body>
</html>
