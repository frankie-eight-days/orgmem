<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>orgmem — Devpost thumbnail</title>
<style>
  :root {
    --bg: #FBFAF7;
    --ink: #12100E;
    --muted: #6E675F;
    --faint: #A49C93;
    --rule: #E4DFD6;
    --rule-lit: #D5CEC2;
    --panel: #FFFEFB;
    --accent: #E5432B;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1800px;
    height: 1200px;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-synthesis-weight: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    box-sizing: border-box;
    width: 1800px;
    height: 1200px;
    padding: 96px 110px 92px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- top row ---------- */

  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: 30px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0;
  }

  /* ---------- main ---------- */

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 54% 46%;
    align-items: center;
    gap: 40px;
    min-height: 0;
  }

  h1 {
    font-size: 86px;
    line-height: 1.0;
    letter-spacing: -0.035em;
    font-weight: 560;
    margin: 0;
    max-width: 15ch;
  }

  .sub {
    margin: 40px 0 0;
    font-size: 33px;
    line-height: 1.42;
    letter-spacing: -0.005em;
    color: var(--muted);
    max-width: 24ch;
  }

  .copy { margin-top: 26px; }

  .motif {
    justify-self: end;
    align-self: center;
  }

  /* ---------- bottom ---------- */

  .stats {
    border-top: 1px solid var(--rule);
    padding-top: 44px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 48px;
  }

  .stat { margin: 0; }

  .stat-n {
    font-size: 62px;
    line-height: 1;
    letter-spacing: -0.04em;
    font-weight: 560;
    font-variant-numeric: tabular-nums;
  }

  .stat-n-accent { color: var(--accent); }

  .stat-l {
    font-family: var(--mono);
    font-size: 21px;
    line-height: 1.5;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 20px 0 0;
  }

  .stat-l span { color: var(--faint); letter-spacing: 0.11em; }
</style>
</head>
<body>
<div class="frame">

  <div class="top">
    <p class="wordmark">orgmem</p>
    <p class="eyebrow">JacHacks SF &middot; 2026</p>
  </div>

  <div class="main">
    <div class="copy">
      <h1>Organizational memory for agents.</h1>
      <p class="sub">Proves what your company never wrote down.</p>
    </div>

    <svg class="motif" width="700" height="780" viewBox="0 0 700 780" fill="none" aria-hidden="true">
      <!-- Structural edges. Mid-tone and thick enough to survive being scaled to a
           Devpost tile; hairlines on cream dissolve there and the graph reads as
           loose dots. -->
      <g stroke="#8C837A" stroke-width="3.2" stroke-linecap="round">
        <line x1="86" y1="176" x2="232" y2="92"/>
        <line x1="232" y1="92" x2="396" y2="168"/>
        <line x1="86" y1="176" x2="196" y2="318"/>
        <line x1="196" y1="318" x2="396" y2="168"/>
        <line x1="396" y1="168" x2="566" y2="96"/>
        <line x1="566" y1="96" x2="648" y2="236"/>
        <line x1="648" y1="236" x2="508" y2="300"/>
        <line x1="396" y1="168" x2="508" y2="300"/>
        <line x1="508" y1="300" x2="628" y2="520"/>
        <line x1="196" y1="318" x2="332" y2="430"/>
        <line x1="332" y1="430" x2="396" y2="168"/>
        <line x1="332" y1="430" x2="508" y2="300"/>
        <line x1="196" y1="318" x2="78" y2="470"/>
        <line x1="78" y1="470" x2="218" y2="596"/>
        <line x1="218" y1="596" x2="332" y2="430"/>
        <line x1="332" y1="430" x2="430" y2="664"/>
        <line x1="430" y1="664" x2="628" y2="520"/>
        <line x1="430" y1="664" x2="556" y2="712"/>
        <line x1="556" y1="712" x2="628" y2="520"/>
        <line x1="218" y1="596" x2="430" y2="664"/>
      </g>

      <!-- The paths that converge on the absent node. -->
      <g stroke="#8C837A" stroke-width="3.2" stroke-linecap="round">
        <line x1="396" y1="168" x2="466" y2="244"/>
        <line x1="508" y1="300" x2="466" y2="244"/>
        <line x1="332" y1="430" x2="466" y2="244"/>
      </g>

      <!-- Edges running off into empty ground: what was never written down. -->
      <g stroke="#A49C93" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 15">
        <line x1="466" y1="244" x2="392" y2="52"/>
        <line x1="466" y1="244" x2="676" y2="404"/>
        <line x1="78" y1="470" x2="44" y2="700"/>
      </g>

      <!-- Nodes. Thirteen, hand-placed, radii varied. -->
      <g fill="#12100E">
        <circle cx="86" cy="176" r="8"/>
        <circle cx="232" cy="92" r="11"/>
        <circle cx="396" cy="168" r="14"/>
        <circle cx="566" cy="96" r="9"/>
        <circle cx="648" cy="236" r="8"/>
        <circle cx="508" cy="300" r="13"/>
        <circle cx="196" cy="318" r="12"/>
        <circle cx="332" cy="430" r="16"/>
        <circle cx="78" cy="470" r="9"/>
        <circle cx="218" cy="596" r="11"/>
        <circle cx="430" cy="664" r="12"/>
        <circle cx="628" cy="520" r="13"/>
        <circle cx="556" cy="712" r="8"/>
      </g>

      <!-- The absent node. -->
      <circle cx="466" cy="244" r="46" fill="#FBFAF7"/>
      <circle cx="466" cy="244" r="46" fill="none" stroke="#E5432B" stroke-width="2.8" opacity="0.4"/>
      <circle cx="466" cy="244" r="30" fill="none" stroke="#E5432B" stroke-width="3.4" opacity="0.75"/>
      <circle cx="466" cy="244" r="18" fill="#E5432B"/>
    </svg>
  </div>

  <div class="stats">
    <p class="stat">
      <span class="stat-n">94.7%</span>
      <span class="stat-l" style="display:block">Accuracy<br><span>78 ground-truth questions</span></span>
    </p>
    <p class="stat">
      <span class="stat-n">96.3%</span>
      <span class="stat-l" style="display:block">Silence class<br><span>vs 55.6% baseline</span></span>
    </p>
    <p class="stat">
      <span class="stat-n">100%</span>
      <span class="stat-l" style="display:block">Jac</span>
    </p>
  </div>

</div>
</body>
</html>
